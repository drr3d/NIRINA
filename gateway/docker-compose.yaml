services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=place_your_pg_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - LITELLM_MASTER_KEY=sk-LITELLM_MASTERKEY_HERE
      - DATABASE_URL=postgresql://litellm:place_your_pg_pass@db:5432/litellm
      - UI_USERNAME=admin
      - UI_PASSWORD=place_your_litellmui_pass
    volumes:
      - ./config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: